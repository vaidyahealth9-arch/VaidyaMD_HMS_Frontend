name: VaidyaMD HMS Frontend CI

on:
  push:
    branches:
      - main
      - development
      - 'feature/**'
      - 'feat/**'
      - 'fix/**'
      - 'bugfix/**'
  pull_request:
    branches:
      - main
      - development

jobs:
  frontend-verify:
    name: Frontend Lint & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint Verification
        run: npm run lint

      - name: Next.js Production Build Validation
        env:
          NEXT_PUBLIC_API_URL: "https://dev-api.vaidyamd.vaidyahealth.com"
          NEXT_PUBLIC_WS_URL: "wss://dev-api.vaidyamd.vaidyahealth.com/ws"
        run: npm run build
